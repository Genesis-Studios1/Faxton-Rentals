version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      desktop-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      mobile-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tests/rules
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      rules-tests-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
