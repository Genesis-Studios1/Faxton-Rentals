name: Validate admin alerts

on:
  pull_request:
    branches: [main]
    paths:
      - "public/js/**"
      - "apps/desktop/**"
      - "apps/mobile/ci/**"
      - "apps/mobile/google-services.json"
      - "public/.well-known/assetlinks.json"
      - "firebase.json"
      - "public/js/main.js"
      - "public/js/dash.js"
      - "public/js/ax.js"
      - "public/js/waitlist.js"
      - "scripts/check-waitlist-icons.mjs"
      - "public/js/store.js"
      - "public/js/ax-shell.js"
      - "public/js/ui.js"
      - "public/sw.js"
      - "public/app/index.html"
      - "scripts/check-app-cache-version.mjs"
      - "firestore.rules"
      - "tests/rules/**"
      - ".github/workflows/validate-admin-alerts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check JavaScript, shell scripts and public configuration
        run: |
          for file in public/js/*.js; do
            node --experimental-default-type=module --check "$file"
          done
          node --experimental-default-type=module --test tests/listing-media.test.mjs
          node --check public/sw.js
          node --check apps/desktop/main.js
          node --check apps/desktop/preload.js
          bash -n apps/mobile/ci/build_android.sh
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/mobile/google-services.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/.well-known/assetlinks.json', 'utf8'))"
          node scripts/check-waitlist-icons.mjs
          node scripts/check-app-cache-version.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firestore rules test dependencies
        run: npm --prefix tests/rules ci --no-audit --no-fund
      - name: Run Firestore security-rule tests
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-faxton "node tests/rules/run.mjs"
