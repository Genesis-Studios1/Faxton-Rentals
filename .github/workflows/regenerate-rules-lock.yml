name: Regenerate rules test lockfile

on:
  push:
    branches:
      - security/storage-disabled-consistency
    paths:
      - ".github/workflows/regenerate-rules-lock.yml"
      - "tests/rules/package.json"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Regenerate lockfile from package manifest
        run: npm --prefix tests/rules install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- tests/rules/package-lock.json; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rules/package-lock.json
          git commit -m "Regenerate Firestore rules test lockfile"
          git push
