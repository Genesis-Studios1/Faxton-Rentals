name: Build and release apps
# Builds the Android, iPhone, Windows, Mac and Linux apps and publishes them as a GitHub Release.
# Run it from the Actions tab ("Run workflow") and type a version such as 1.0.1, or push a tag like v1.0.1.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.1"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]
concurrency:
  group: release-apps
  cancel-in-progress: false
permissions:
  contents: read
env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          V="${VERSION#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and create the Android project
        working-directory: apps/mobile
        run: |
          npm install --no-audit --no-fund
          npm version ${{ needs.version.outputs.v }} --no-git-tag-version --allow-same-version
          node -e "const f='capacitor.config.json',c=require('./'+f);c.appendUserAgent='FaxtonApp/mobile/${{ needs.version.outputs.v }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          cp google-services.json android/app/google-services.json
          # The Google sign-in libraries are optional in the plugin; without this the app has no Google sign-in code ("No credentials available").
          sed -i '0,/ext {/s//ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          grep -n rgcfaIncludeGoogle android/variables.gradle
          npx capacitor-assets generate --android --assetPath assets
          npx cap sync android
      - name: Harden and version the Android project
        working-directory: apps/mobile/android
        run: |
          M=app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          sed -i 's/<application/<application android:usesCleartextTraffic="false"/' "$M"
          # Calls (camera, microphone), map location and notifications
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" /><uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-feature android:name="android.hardware.camera" android:required="false" /><uses-feature android:name="android.hardware.microphone" android:required="false" /><application#' "$M"
          sed -i "s/versionCode 1/versionCode ${{ needs.version.outputs.code }}/; s/versionName \"1.0\"/versionName \"${{ needs.version.outputs.v }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
      - name: Keep the app below the Android status bar
        working-directory: apps/mobile/android
        run: |
          F=$(find app/src/main/java -name MainActivity.java | head -1)
          cat > "$F" <<'JAVA'
          package com.faxton.rentals;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              // Android 15 draws apps edge to edge. Pad the web view by the system bars so the page never sits under the clock and battery.
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              getWindow().getDecorView().setBackgroundColor(Color.WHITE);
              WindowInsetsControllerCompat c = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
              c.setAppearanceLightStatusBars(true);
              c.setAppearanceLightNavigationBars(true);
              View content = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                Insets i = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout() | WindowInsetsCompat.Type.ime());
                v.setPadding(i.left, i.top, i.right, i.bottom);
                return WindowInsetsCompat.CONSUMED;
              });
            }
          }
          JAVA
          sed -i 's/^          //' "$F"
          head -5 "$F"
      - name: Build (signed when the signing secrets exist)
        working-directory: apps/mobile/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x gradlew
          G=app/build.gradle
          SIGN=""
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS"
          else
            echo "::warning::No Android signing key set. Building a debug-signed APK (installs fine, but updates need the same key each time)."
          fi
          # 1) x64 build (Intel/AMD devices, Chromebooks and emulators)
          sed -i "0,/defaultConfig {/s//defaultConfig {\n        ndk { abiFilters 'x86_64' }/" "$G"
          if [ -n "$KS" ]; then
            ./gradlew --no-daemon assembleRelease $SIGN
            cp app/build/outputs/apk/release/app-release.apk ../../../Faxton-Rentals-Android-x64.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../../Faxton-Rentals-Android-x64.apk
          fi
          # 2) universal build (phones and tablets) plus the Play Store bundle
          sed -i "/ndk { abiFilters 'x86_64' }/d" "$G"
          if [ -n "$KS" ]; then
            ./gradlew --no-daemon clean assembleRelease bundleRelease $SIGN
            cp app/build/outputs/apk/release/app-release.apk ../../../Faxton-Rentals-Android.apk
            cp app/build/outputs/bundle/release/app-release.aab ../../../Faxton-Rentals-Android.aab
            rm -f "$RUNNER_TEMP/release.jks"
          else
            ./gradlew --no-daemon clean assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../../Faxton-Rentals-Android.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Faxton-Rentals-Android.*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the Windows installer
        working-directory: apps/desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm version ${{ needs.version.outputs.v }} --no-git-tag-version --allow-same-version
          npx electron-builder --win --publish never
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/dist/Faxton-Rentals-Windows-*.exe
            apps/desktop/dist/Faxton-Rentals-Windows-*.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error

  mac:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the Mac apps (Apple Silicon and Intel)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm version ${{ needs.version.outputs.v }} --no-git-tag-version --allow-same-version
          npx electron-builder --mac --publish never
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            apps/desktop/dist/Faxton-Rentals-Mac-*.dmg
            apps/desktop/dist/Faxton-Rentals-Mac-*.zip
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the Linux apps (x64 and arm64, AppImage and .deb)
        working-directory: apps/desktop
        run: |
          npm install --no-audit --no-fund
          npm version ${{ needs.version.outputs.v }} --no-git-tag-version --allow-same-version
          npx electron-builder --linux --x64 --arm64 --publish never
          cd dist
          for f in Faxton-Rentals-Linux-amd64.deb; do [ -f "$f" ] && mv "$f" Faxton-Rentals-Linux-x64.deb; done || true
          ls
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/dist/Faxton-Rentals-Linux-*.AppImage
            apps/desktop/dist/Faxton-Rentals-Linux-*.deb
          if-no-files-found: error

  ios:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Create the iOS project
        working-directory: apps/mobile
        run: |
          npm install --no-audit --no-fund
          node -e "const f='capacitor.config.json',c=require('./'+f);c.appendUserAgent='FaxtonApp/mobile/${{ needs.version.outputs.v }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add ios
          npx capacitor-assets generate --ios --assetPath assets
          npx cap sync ios
      - name: Version the iOS project
        working-directory: apps/mobile/ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.version.outputs.v }}" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ needs.version.outputs.code }}" App/Info.plist
      - name: Build an unsigned iPhone app (.ipa)
        working-directory: apps/mobile/ios/App
        run: |
          WS=App.xcworkspace; [ -d "$WS" ] || WS=""
          if [ -n "$WS" ]; then TARGET="-workspace $WS"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Faxton-Rentals-iPhone-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Faxton-Rentals-iPhone-unsigned.ipa
          if-no-files-found: error

  release:
    needs: [version, android, windows, mac, linux, ios]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.android.result == 'success' || needs.windows.result == 'success' || needs.mac.result == 'success' || needs.linux.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.v }}
          name: Faxton Rentals ${{ needs.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: false
          files: out/*
          body: |
            Faxton Rentals ${{ needs.version.outputs.v }}
            - Android: Faxton-Rentals-Android.apk (phones), Faxton-Rentals-Android-x64.apk (Intel/x86), Faxton-Rentals-Android.aab (Play Store)
            - iPhone: Faxton-Rentals-iPhone-unsigned.ipa (install with AltStore or Sideloadly)
            - Windows: Faxton-Rentals-Windows-x64.exe / Faxton-Rentals-Windows-arm64.exe
            - Mac: Faxton-Rentals-Mac-arm64.dmg (Apple Silicon) / Faxton-Rentals-Mac-x64.dmg (Intel)
            - Linux: Faxton-Rentals-Linux-x64 / -arm64 as .AppImage or .deb
