name: Build and release apps
# Builds the Android, iPhone, Windows, Mac and Linux apps and publishes them as a GitHub Release.
# Run it from the Actions tab ("Run workflow") and type a version such as 1.0.1, or push a tag like v1.0.1.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.1"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]
concurrency:
  group: release-apps
  cancel-in-progress: false
permissions:
  contents: write
env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  # Installers go to the public downloads repo when RELEASES_TOKEN exists, else to this repo's Releases page.
  REL_REPO: ${{ secrets.RELEASES_TOKEN && 'musazaneerah4-crypto/Faxton-Rentals-Downloads' || github.repository }}
  GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          V="${VERSION#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      # Each build uploads straight to this release (no Actions artifacts, which fill the free storage allowance).
      - name: Create the release
        run: |
          V="${VERSION#v}"
          gh release view "v$V" --repo "$REL_REPO" >/dev/null 2>&1 || gh release create "v$V" --repo "$REL_REPO" --title "Faxton Rentals $V" --latest --notes "Faxton Rentals $V - Android: Faxton-Rentals-Android.apk (phones), Faxton-Rentals-Android-x64.apk (Intel/x86), Faxton-Rentals-Android.aab (Play Store bundle). iPhone: Faxton-Rentals-iPhone-unsigned.ipa (AltStore or Sideloadly). Windows: Faxton-Rentals-Windows-x64.exe / -arm64.exe. Mac: Faxton-Rentals-Mac-arm64.dmg / -x64.dmg. Linux: Faxton-Rentals-Linux-x64 / -arm64 as .AppImage or .deb."

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and create the Android project
        working-directory: apps/mobile
        run: |
          npm install --no-audit --no-fund
          npm version ${{ needs.version.outputs.v }} --no-git-tag-version --allow-same-version
          node -e "const f='capacitor.config.json',c=require('./'+f);c.appendUserAgent='FaxtonApp/mobile/${{ needs.version.outputs.v }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          # Gives the google-services Gradle plugin the web client id (it becomes R.string.default_web_client_id, the serverClientId of Google sign-in).
          cp google-services.json android/app/google-services.json
          npx capacitor-assets generate --android --assetPath assets
          npx cap sync android
      # Permissions, Google sign-in libraries (rgcfaIncludeGoogle), https deep links, status-bar padding, version and protected signing key.
      # Every edit is asserted inside the script, so a template change fails the build instead of shipping a half-patched app.
      - name: Patch the Android project
        working-directory: apps/mobile
        run: python3 ci/patch_android.py android "${{ needs.version.outputs.v }}" "${{ needs.version.outputs.code }}"
      # Signs only with the protected ANDROID_KEYSTORE_* secrets. Register the replacement certificate fingerprints in Firebase.
      - name: Build and sign the Android apps
        working-directory: apps/mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ../ci/build_android.sh
      - name: Upload android files to the release
        shell: bash
        run: gh release upload "v${VERSION#v}" Faxton-Rentals-Android* --repo "$REL_REPO" --clobber

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the Windows installer
        working-directory: apps/desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm version ${{ needs.version.outputs.v }} --no-git-tag-version --allow-same-version
          npx electron-builder --win --publish never
          ls dist
      - name: Upload windows files to the release
        shell: bash
        run: gh release upload "v${VERSION#v}" apps/desktop/dist/Faxton-Rentals-Windows-*.exe apps/desktop/dist/Faxton-Rentals-Windows-*.exe.blockmap apps/desktop/dist/latest.yml --repo "$REL_REPO" --clobber

  mac:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the Mac apps (Apple Silicon and Intel)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm version ${{ needs.version.outputs.v }} --no-git-tag-version --allow-same-version
          npx electron-builder --mac --publish never
          ls dist
      - name: Upload mac files to the release
        shell: bash
        run: gh release upload "v${VERSION#v}" apps/desktop/dist/Faxton-Rentals-Mac-*.dmg apps/desktop/dist/Faxton-Rentals-Mac-*.zip --repo "$REL_REPO" --clobber

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the Linux apps (x64 and arm64, AppImage and .deb)
        working-directory: apps/desktop
        run: |
          npm install --no-audit --no-fund
          npm version ${{ needs.version.outputs.v }} --no-git-tag-version --allow-same-version
          npx electron-builder --linux --x64 --arm64 --publish never
          cd dist
          for f in Faxton-Rentals-Linux-amd64.deb; do [ -f "$f" ] && mv "$f" Faxton-Rentals-Linux-x64.deb; done || true
          ls
      - name: Upload linux files to the release
        shell: bash
        run: gh release upload "v${VERSION#v}" apps/desktop/dist/Faxton-Rentals-Linux-*.AppImage apps/desktop/dist/Faxton-Rentals-Linux-*.deb --repo "$REL_REPO" --clobber

  ios:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Create the iOS project
        working-directory: apps/mobile
        run: |
          npm install --no-audit --no-fund
          node -e "const f='capacitor.config.json',c=require('./'+f);c.appendUserAgent='FaxtonApp/mobile/${{ needs.version.outputs.v }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add ios
          npx capacitor-assets generate --ios --assetPath assets
      # The Firebase iOS SDK crashes on launch without a GoogleService-Info.plist. A real one (from an iOS app registered in Firebase, committed as
      # apps/mobile/GoogleService-Info.plist or stored in the IOS_GOOGLE_SERVICE_INFO_BASE64 secret) turns Google sign-in on; without it a minimal
      # plist keeps the app opening and Google sign-in is switched off (the app then says so and offers email sign-in).
      - name: Set up Google sign-in for iPhone
        working-directory: apps/mobile
        env:
          IOS_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_BASE64 }}
        run: |
          bash ci/ios_google.sh detect
          IOS_GOOGLE="$(grep '^IOS_GOOGLE=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)"
          if [ "$IOS_GOOGLE" = yes ]; then
            bash ci/ios_google.sh enable || { echo "::warning::Could not enable Google sign-in for iPhone; building without it."; echo "IOS_GOOGLE=no" >> "$GITHUB_ENV"; }
          fi
      - name: Finish the iOS project
        working-directory: apps/mobile
        run: |
          if [ "$IOS_GOOGLE" != yes ]; then
            node -e "const f='capacitor.config.json',c=require('./'+f);c.appendUserAgent+=' FaxtonNoGoogle';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          fi
          npx cap sync ios
      - name: Version the iOS project
        working-directory: apps/mobile/ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.version.outputs.v }}" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ needs.version.outputs.code }}" App/Info.plist
      - name: Build an unsigned iPhone app (.ipa)
        working-directory: apps/mobile/ios/App
        run: |
          WS=App.xcworkspace; [ -d "$WS" ] || WS=""
          if [ -n "$WS" ]; then TARGET="-workspace $WS"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          # Firebase reads this file from the app bundle when the app starts (the .ipa is unsigned, so adding it here is safe).
          cp "$RUNNER_TEMP/GoogleService-Info.plist" "$RUNNER_TEMP/ipa/Payload/App.app/GoogleService-Info.plist"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Faxton-Rentals-iPhone-unsigned.ipa" Payload)
      - name: Upload ios files to the release
        shell: bash
        run: gh release upload "v${VERSION#v}" Faxton-Rentals-iPhone-unsigned.ipa --repo "$REL_REPO" --clobber
