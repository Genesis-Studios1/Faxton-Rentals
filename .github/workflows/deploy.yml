name: Deploy to Firebase
# Deploys the site (and Firestore rules) from GitHub's servers, so no local Firebase CLI is needed.
# One-time setup: add a repository secret named FIREBASE_SERVICE_ACCOUNT containing the service-account JSON
# (Firebase console -> Project settings -> Service accounts -> Generate new private key).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT. See README > Deploy from GitHub."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Build crawlable HTML from currently published Firestore records before checking and deploying.
      - name: Build public SEO pages and deploy hosting
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node --check scripts/build-public-site.mjs
          node --check public/js/legacy-redirect.js
          node --check public/js/robust.js
          node --check public/sw.js
          REQUIRE_PUBLIC_LISTINGS=1 node scripts/build-public-site.mjs
          node scripts/check-release.mjs
          npx --yes firebase-tools deploy --only hosting --project faxton-rentals --non-interactive
      # Not continue-on-error: if the rules can't be published the run turns red, so a stale ruleset is never silent.
      - name: Deploy Firestore rules (needs the Firestore database to exist)
        run: npx --yes firebase-tools deploy --only firestore:rules --project faxton-rentals --non-interactive
      # Indexes need the service account to hold the "Datastore Index Admin" role (IAM). Until it does, this step warns instead of failing the release.
      - name: Deploy Firestore indexes (optional)
        continue-on-error: true
        run: npx --yes firebase-tools deploy --only firestore:indexes --project faxton-rentals --non-interactive
      - name: Deploy Storage rules (needs Firebase Storage to be enabled)
        continue-on-error: true
        run: npx --yes firebase-tools deploy --only storage --project faxton-rentals --non-interactive
      # After the deploy, make sure the live site answers and still sends its security headers and the offline/404 pages.
      - name: Smoke test the live site
        run: |
          set -e
          H=$(curl -fsSI https://faxtonrentals.com/)
          echo "$H" | grep -qi '^content-security-policy:' || { echo "::error::Live site is missing its Content-Security-Policy header"; exit 1; }
          echo "$H" | grep -qi '^strict-transport-security:' || { echo "::error::Live site is missing HSTS"; exit 1; }
          curl -fsS https://faxtonrentals.com/app/ -o /dev/null
          curl -fsS https://faxtonrentals.com/about -o /dev/null
          curl -fsS https://faxtonrentals.com/properties -o /dev/null
          curl -fsS https://faxtonrentals.com/sitemap.xml -o /dev/null
          curl -fsS https://faxtonrentals.com/robots.txt -o /dev/null
          curl -fsS https://faxtonrentals.com/sw.js -o /dev/null
          curl -fsS https://faxtonrentals.com/manifest.webmanifest -o /dev/null
          curl -fsS https://faxtonrentals.com/.well-known/assetlinks.json -o /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' https://faxtonrentals.com/this-page-does-not-exist)
          [ "$code" = "404" ] || { echo "::error::Unknown pages should answer 404, got $code"; exit 1; }
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
