name: Deploy to Firebase
# Deploys the site (and Firestore rules) from GitHub's servers, so no local Firebase CLI is needed.
# One-time setup: add a repository secret named FIREBASE_SERVICE_ACCOUNT containing the service-account JSON
# (Firebase console -> Project settings -> Service accounts -> Generate new private key).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT. See README > Deploy from GitHub."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test property listing media and syntax
        run: |
          node --experimental-default-type=module --test tests/listing-media.test.mjs
          node --experimental-default-type=module --check public/js/admin2.js
          node --experimental-default-type=module --check public/js/dash.js
          node --experimental-default-type=module --check public/js/ax.js
          node --experimental-default-type=module --check public/js/waitlist.js
          node scripts/check-waitlist-icons.mjs
          node --experimental-default-type=module --check public/js/main.js
          node --experimental-default-type=module --check public/js/gate.js
          node --experimental-default-type=module --check public/js/views.js
          node --experimental-default-type=module --check public/js/store.js
          node --experimental-default-type=module --check public/js/ax-shell.js
          node --experimental-default-type=module --check public/js/listing-media.js
          node --experimental-default-type=module --check public/js/listing-media-core.js
          node --experimental-default-type=module --check public/js/pdp.js
      # Build crawlable HTML from currently published Firestore records before checking and deploying.
      - name: Build public SEO pages and deploy hosting
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node --check scripts/build-public-site.mjs
          node --check public/js/legacy-redirect.js
          node --check public/js/marketing.js
          node --check public/js/apps.js
          node --check public/js/robust.js
          node --check public/sw.js
          REQUIRE_PUBLIC_LISTINGS=1 node scripts/build-public-site.mjs
          node scripts/check-release.mjs
          npx --yes firebase-tools deploy --only hosting --project faxton-rentals --non-interactive
      # Not continue-on-error: if the rules can't be published the run turns red, so a stale ruleset is never silent.
      - name: Deploy Firestore rules (needs the Firestore database to exist)
        run: npx --yes firebase-tools deploy --only firestore:rules --project faxton-rentals --non-interactive
      # Indexes need the service account to hold the "Datastore Index Admin" role (IAM). Until it does, this step warns instead of failing the release.
      - name: Deploy Firestore indexes (optional)
        continue-on-error: true
        run: npx --yes firebase-tools deploy --only firestore:indexes --project faxton-rentals --non-interactive
      # Storage is intentionally skipped because this project does not use Firebase Storage and the default bucket
      # is not configured for the project/service account. Deploying Storage here causes a 403 defaultBucket lookup.
      # After the deploy, make sure the live site answers and still sends its security headers and the offline/404 pages.
      - name: Smoke test the live site
        run: |
          set -euo pipefail
          HOST=https://faxton-rentals.web.app

          fail() {
            echo "::error::$1"
            exit 1
          }

          check_home_text() {
            local label="$1"
            local expected="$2"
            local html
            html="$(curl -fsS "$HOST/")" || fail "Could not fetch the Firebase homepage while checking: $label"
            if ! printf '%s' "$html" | grep -Fq -- "$expected"; then
              fail "Firebase homepage is missing $label (expected: $expected)"
            fi
          }

          check_page() {
            local path="$1"
            curl -fsS "$HOST$path" -o /dev/null || fail "Firebase Hosting route did not respond successfully: $path"
          }

          H="$(curl -fsSI "$HOST/")" || fail "Could not reach Firebase Hosting at $HOST/"
          echo "$H" | grep -qi '^content-security-policy:' || fail "Firebase Hosting is missing its Content-Security-Policy header"
          echo "$H" | grep -qi '^strict-transport-security:' || fail "Firebase Hosting is missing HSTS"

          check_home_text "the homepage hero" "Find a home that feels like"
          check_home_text "the app CTA section" 'id="open-app"'
          check_home_text "the current CTA panel" "Ready to get started?"
          check_home_text "the signup CTA link" 'href="/app/#/signup">Open the web app'

          for path in /app/ /about /features /how-it-works /properties /sitemap.xml /robots.txt /sw.js /manifest.webmanifest /.well-known/assetlinks.json; do
            check_page "$path"
          done

          code="$(curl -sS -o /dev/null -w '%{http_code}' "$HOST/this-page-does-not-exist")" || fail "Could not check the unknown-page response"
          [ "$code" = "404" ] || fail "Unknown Firebase Hosting pages should answer 404, got $code"

          if curl -fsS https://faxtonrentals.com/ > "$RUNNER_TEMP/custom-domain.html"; then
            if grep -q "Find a home that feels like" "$RUNNER_TEMP/custom-domain.html"; then
              echo "Custom domain is serving the new Faxton public SEO homepage."
            else
              echo "::warning::faxtonrentals.com is not yet serving the new Firebase SEO homepage. Check which host/deployment currently owns the custom domain."
              grep -io '<title>[^<]*</title>' "$RUNNER_TEMP/custom-domain.html" | head -1 || true
            fi
            curl -sSI https://faxtonrentals.com/ | grep -iE '^(server|via|x-vercel-id|x-served-by|content-type):' || true
          else
            echo "::warning::Custom domain could not be reached during the smoke test."
          fi
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
