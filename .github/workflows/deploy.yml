name: Deploy to Firebase
# Private KYC documents depend on Firebase Storage. Deploy storage + Firestore rules before hosting.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT. See README > Deploy from GitHub."; exit 1; fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release check
        run: node scripts/check-release.mjs
      # These rules must deploy before Hosting; if Firebase Storage is not enabled/billed correctly, stop here.
      - name: Deploy Storage rules (required for private KYC documents)
        run: npx --yes firebase-tools deploy --only storage --project faxton-rentals --non-interactive
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools deploy --only firestore:rules --project faxton-rentals --non-interactive
      - name: Deploy hosting
        run: npx --yes firebase-tools deploy --only hosting --project faxton-rentals --non-interactive
      - name: Deploy Firestore indexes (optional)
        continue-on-error: true
        run: npx --yes firebase-tools deploy --only firestore:indexes --project faxton-rentals --non-interactive
      - name: Smoke test the live site
        run: |
          set -e
          H=$(curl -fsSI https://faxton-rentals.web.app/)
          echo "$H" | grep -qi '^content-security-policy:' || { echo "::error::Live site is missing its Content-Security-Policy header"; exit 1; }
          echo "$H" | grep -qi '^strict-transport-security:' || { echo "::error::Live site is missing HSTS"; exit 1; }
          curl -fsS https://faxton-rentals.web.app/sw.js -o /dev/null
          curl -fsS https://faxton-rentals.web.app/manifest.webmanifest -o /dev/null
          curl -fsS https://faxton-rentals.web.app/.well-known/assetlinks.json -o /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' https://faxton-rentals.web.app/this-page-does-not-exist)
          [ "$code" = "404" ] || { echo "::error::Unknown pages should answer 404, got $code"; exit 1; }
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
