name: Validate application changes
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/**"
      - "fix/**"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check public release files and CSP
        run: npm run check
      - name: Parse public JavaScript modules
        shell: bash
        run: |
          set -e
          for file in public/js/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Parse Cloud Functions
        run: node --check functions/index.js
      - name: Run Firestore security rules tests
        run: npm run test:rules
