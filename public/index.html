<style>
  /* Splash screen: inline so it paints before anything else loads. The artwork is your image: its lines are revealed (drawn) over 2 seconds. */
  #splash{position:fixed;inset:0;z-index:1000;overflow:hidden;color:#fff;background:#01100c;font-family:"Reddit Sans","Reddit Fallback",system-ui,sans-serif;clip-path:circle(150% at 50% 44%);transition:clip-path .95s cubic-bezier(.75,0,.2,1),opacity .95s ease-in}
  #splash.leave{clip-path:circle(0% at 50% 44%);opacity:0;pointer-events:none}
  #splash.leave .sp-center{transform:translateX(-50%) scale(.8);opacity:0;transition:transform .7s cubic-bezier(.6,0,.4,1),opacity .6s}
  html.no-splash #splash{display:none}
  #splash .sp-art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:50% 100%;background:#01100c}
  #splash .sp-fb{opacity:0;pointer-events:none;transition:opacity .6s}#splash.fb .sp-fb{opacity:1}#splash.fb #spv{display:none}
  #splash .sp-center{position:absolute;left:50%;top:21%;transform:translateX(-50%);display:grid;justify-items:center;text-align:center;width:max-content}
  #splash .sp-mark{display:block;width:clamp(96px,10vw,190px);height:auto;overflow:visible}
  #splash .sp-mark path{transform-box:fill-box;opacity:0}
  #splash .sp-f{fill:#34d399;transform-origin:left center;animation:spF .8s .2s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-s{fill:#fff;transform-origin:center bottom;animation:spS .6s .6s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-r{fill:#fff;transform-origin:left bottom;animation:spR .8s .4s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-word{font:400 clamp(1.7rem,3.4vw,3.6rem)/1.1 "Bricolage Grotesque","Bricolage Fallback",system-ui,sans-serif;margin-top:clamp(14px,2.2vw,34px);white-space:nowrap}
  #splash .sp-word b{font-weight:800;display:inline-block;opacity:0;animation:spWord .9s .9s cubic-bezier(.2,.8,.2,1) forwards}
  #splash .sp-word span{display:inline-block;opacity:0;animation:spWord .9s 1.1s cubic-bezier(.2,.8,.2,1) forwards}
  #splash .sp-tag{margin:clamp(10px,1.4vw,22px) 0 0;font:400 clamp(.8rem,1.3vw,1.4rem)/1.4 "Reddit Sans","Reddit Fallback",system-ui,sans-serif;color:#a9d9c6;letter-spacing:.2em;opacity:0;animation:spTag 1.1s 1.4s ease-out forwards}
  #splash .sp-dots{position:absolute;left:0;right:0;bottom:clamp(48px,10vh,110px);display:flex;gap:14px;justify-content:center;align-items:center}
  #splash .sp-dots i{display:block;position:relative;width:12px;height:12px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;opacity:0}
  #splash .sp-dots i b{position:absolute;inset:0;background:#34d399;transform:scaleX(0);transform-origin:left}
  #splash .sp-dots i:nth-child(1){animation:spDotIn .5s .3s forwards,spPill .9s 1.0s ease-in-out forwards}.sp-dots i:nth-child(1) b{animation:spFill .8s 1.0s ease-in-out forwards}
  #splash .sp-dots i:nth-child(2){animation:spDotIn .5s .4s forwards,spPill .9s 1.8s ease-in-out forwards}.sp-dots i:nth-child(2) b{animation:spFill .8s 1.8s ease-in-out forwards}
  #splash .sp-dots i:nth-child(3){animation:spDotIn .5s .5s forwards,spPill .9s 2.6s ease-in-out forwards}.sp-dots i:nth-child(3) b{animation:spFill .8s 2.6s ease-in-out forwards}
  @keyframes spDraw{to{stroke-dashoffset:0}}
  @keyframes spFin{to{opacity:1}}
  @keyframes spF{from{opacity:0;transform:translateX(-45%) scaleX(.4)}to{opacity:1;transform:none}}
  @keyframes spS{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
  @keyframes spR{from{opacity:0;transform:translate(35%,25%) rotate(10deg)}to{opacity:1;transform:none}}
  @keyframes spWord{from{opacity:0;transform:translateY(18px);letter-spacing:.14em}to{opacity:1;transform:none;letter-spacing:-.01em}}
  @keyframes spTag{from{opacity:0;letter-spacing:.42em}to{opacity:1;letter-spacing:.2em}}
  @keyframes spDotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  @keyframes spPill{0%{width:12px}25%,75%{width:46px}100%{width:12px}}
  @keyframes spFill{to{transform:scaleX(1)}}
  @media (max-aspect-ratio:1/1){
    #splash{background:radial-gradient(70% 26% at 50% 24%,#04704a 0%,#02452f 45%,#01100c 100%)}
    #splash .sp-art{inset:auto 0 0 0;height:calc(100vw * 941 / 1672);-webkit-mask-image:linear-gradient(180deg,transparent 42%,#000 50%);mask-image:linear-gradient(180deg,transparent 42%,#000 50%)}
    #splash .sp-center{top:22%}
  }
  @media (prefers-reduced-motion:reduce){#splash *,#splash{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.2s!important}#splash .sp-dots i b{transform:scaleX(1)}}
