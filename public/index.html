<style>
  /* Splash screen: inline so it paints before anything else loads */
  #splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;text-align:center;overflow:hidden;color:#fff;
    background:radial-gradient(120% 90% at 50% 38%,#0b4a39 0%,#073b2d 55%,#052c22 100%);clip-path:circle(150% at 50% 44%);transition:clip-path .95s cubic-bezier(.75,0,.2,1),opacity .95s ease-in}
  #splash.leave{clip-path:circle(0% at 50% 44%);opacity:.0;pointer-events:none}
  #splash.leave .sp-center{transform:scale(.7);opacity:0;transition:transform .7s cubic-bezier(.6,0,.4,1),opacity .6s}
  html.no-splash #splash{display:none}
  #splash .sp-bld{position:absolute;right:0;bottom:0;width:min(46vw,560px);opacity:0;mix-blend-mode:luminosity;animation:spBld 1.6s .1s cubic-bezier(.2,.8,.2,1) forwards}
  #splash .sp-glow{position:absolute;width:60vmin;height:60vmin;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.28),transparent 65%);opacity:0;animation:spGlow 2.2s .5s ease-out forwards}
  #splash .sp-center{position:relative;display:grid;justify-items:center;gap:0}
  #splash .sp-markwrap{position:relative;width:clamp(120px,19vw,200px)}#splash .sp-mark{display:block;width:100%;height:auto;overflow:visible}
  #splash .sp-mark path{transform-box:fill-box;opacity:0}
  #splash .sp-f{fill:#34d399;transform-origin:left center;animation:spF .8s .2s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-s{fill:#fff;transform-origin:center bottom;animation:spS .6s .6s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-r{fill:#fff;transform-origin:left bottom;animation:spR .8s .4s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-mark{animation:spPulse 1.2s 1.1s ease-in-out 1}
  #splash .sp-word{font:400 clamp(2.1rem,6.2vw,4rem)/1.1 'Inter Tight',Inter,system-ui,sans-serif;margin-top:clamp(14px,2.4vw,26px);white-space:nowrap}
  #splash .sp-word b{font-weight:800;display:inline-block;opacity:0;animation:spWord .9s .9s cubic-bezier(.2,.8,.2,1) forwards}
  #splash .sp-word span{display:inline-block;opacity:0;animation:spWord .9s 1.1s cubic-bezier(.2,.8,.2,1) forwards}
  #splash .sp-tag{margin:clamp(10px,1.6vw,18px) 0 0;font:400 clamp(.78rem,1.8vw,1.1rem)/1.4 Inter,system-ui,sans-serif;color:#a9d9c6;letter-spacing:.2em;opacity:0;animation:spTag 1.1s 1.4s ease-out forwards}
  #splash .sp-dots{position:absolute;left:0;right:0;bottom:clamp(48px,9vh,96px);display:flex;gap:14px;justify-content:center;align-items:center}
  #splash .sp-dots i{display:block;position:relative;width:12px;height:12px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;opacity:0;animation:spDotIn .5s .3s forwards}
  #splash .sp-dots i b{position:absolute;inset:0;background:#34d399;transform:scaleX(0);transform-origin:left}
  #splash .sp-dots i:nth-child(1){animation:spDotIn .5s .4s forwards,spPill .9s 1.0s ease-in-out forwards}.sp-dots i:nth-child(1) b{animation:spFill .8s 1.0s ease-in-out forwards}
  #splash .sp-dots i:nth-child(2){animation:spDotIn .5s .4s forwards,spPill .9s 1.8s ease-in-out forwards}.sp-dots i:nth-child(2) b{animation:spFill .8s 1.8s ease-in-out forwards}
  #splash .sp-dots i:nth-child(3){animation:spDotIn .5s .5s forwards,spPill .9s 2.6s ease-in-out forwards}.sp-dots i:nth-child(3) b{animation:spFill .8s 2.6s ease-in-out forwards}
  #splash .sp-shine{position:absolute;inset:0;z-index:2;pointer-events:none;-webkit-mask:url(assets/mark.svg) center/100% 100% no-repeat;mask:url(assets/mark.svg) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) no-repeat;background-size:260% 100%;background-position:160% 0;animation:spShine 1.1s 1.2s ease-in-out forwards}
  #splash .sp-ring{position:absolute;left:50%;top:44%;width:34vmin;height:34vmin;margin:-17vmin 0 0 -17vmin;border:1.5px solid rgba(52,211,153,.4);border-radius:50%;opacity:0;animation:spRing 2.8s var(--d) cubic-bezier(.2,.6,.3,1) infinite}
  #splash .sp-parts i{position:absolute;bottom:-20px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:rgba(167,232,207,.55);opacity:0;animation:spUp var(--t) var(--dl) linear infinite}
  #splash .sp-bld{animation:spBld 1.6s .1s cubic-bezier(.2,.8,.2,1) forwards,spKen 8s .1s ease-out forwards}
  @keyframes spShine{from{background-position:160% 0}to{background-position:-60% 0}}
  @keyframes spRing{0%{opacity:0;transform:scale(.35)}20%{opacity:.7}100%{opacity:0;transform:scale(2.6)}}
  @keyframes spUp{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-105vh) translateX(18px)}}
  @keyframes spKen{from{scale:1.0}to{scale:1.08}}
  @keyframes spBld{from{opacity:0;transform:translate(60px,40px)}to{opacity:.3;transform:none}}
  @keyframes spGlow{0%{opacity:0;transform:scale(.6)}50%{opacity:1}100%{opacity:.55;transform:scale(1.1)}}
  @keyframes spF{from{opacity:0;transform:translateX(-45%) scaleX(.4)}to{opacity:1;transform:none}}
  @keyframes spS{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
  @keyframes spR{from{opacity:0;transform:translate(35%,25%) rotate(10deg)}to{opacity:1;transform:none}}
  @keyframes spPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(52,211,153,0))}50%{filter:drop-shadow(0 0 22px rgba(52,211,153,.55))}}
  @keyframes spWord{from{opacity:0;transform:translateY(18px);letter-spacing:.14em}to{opacity:1;transform:none;letter-spacing:-.01em}}
  @keyframes spTag{from{opacity:0;letter-spacing:.42em}to{opacity:1;letter-spacing:.2em}}
  @keyframes spDotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  @keyframes spPill{0%{width:12px}25%,75%{width:46px}100%{width:12px}}
  @keyframes spFill{to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){#splash *,#splash{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.2s!important}#splash .sp-dots i b{transform:scaleX(1)}}
</style>

<body>

  <div class="sp-parts" aria-hidden="true"><i style="--x:8%;--s:6px;--t:5.5s;--dl:0.2s"></i><i style="--x:17%;--s:4px;--t:6.5s;--dl:1.1s"></i><i style="--x:26%;--s:8px;--t:5s;--dl:0.6s"></i><i style="--x:35%;--s:5px;--t:6s;--dl:1.8s"></i><i style="--x:44%;--s:7px;--t:5.8s;--dl:0.3s"></i><i style="--x:53%;--s:4px;--t:6.8s;--dl:1.4s"></i><i style="--x:62%;--s:6px;--t:5.2s;--dl:0.9s"></i><i style="--x:71%;--s:8px;--t:6.2s;--dl:0.1s"></i><i style="--x:80%;--s:5px;--t:5.6s;--dl:1.6s"></i><i style="--x:89%;--s:7px;--t:6.4s;--dl:0.7s"></i><i style="--x:95%;--s:4px;--t:5.4s;--dl:1.2s"></i><i style="--x:3%;--s:5px;--t:6.6s;--dl:2.0s"></i></div>
  <div class="sp-center">
    <div class="sp-markwrap"><div class="sp-shine"></div>
    <svg class="sp-mark" viewBox="570 235 415 355" aria-hidden="true">
      <path class="sp-f" d="M576 242H803L745 316H651V377H775V411L651 455V581H576Z"/>
      <path class="sp-s" d="M702 455L775 429V581H702Z"/>
      <path class="sp-r" d="M825 242H860C915 242 958 290 958 346C958 395 925 430 884 441L977 581H885L793 443V377H847C865 377 878 363 878 346C878 329 865 316 847 316H766Z"/>
    </svg></div>
    <div class="sp-word"><b>Faxton</b> <span>Rentals</span></div>
    <p class="sp-tag">Your next home starts here.</p>
  </div>
  <div class="sp-dots" aria-hidden="true"><i><b></b></i><i><b></b></i><i><b></b></i></div>
</div>
