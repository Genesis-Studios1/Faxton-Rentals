<style>
  /* Splash screen: inline so it paints before anything else loads. The artwork is your image: its lines are revealed (drawn) over 2 seconds. */
  #splash{position:fixed;inset:0;z-index:1000;overflow:hidden;color:#fff;background:#01100c;font-family:var(--font-body,system-ui),system-ui,sans-serif;clip-path:circle(150% at 50% 44%);transition:clip-path .95s cubic-bezier(.75,0,.2,1),opacity .95s ease-in}
  #splash.leave{clip-path:circle(0% at 50% 44%);opacity:0;pointer-events:none}
  #splash.leave .sp-center{transform:translateX(-50%) scale(.8);opacity:0;transition:transform .7s cubic-bezier(.6,0,.4,1),opacity .6s}
  html.no-splash #splash{display:none}
  #splash .sp-art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:50% 100%;background:#01100c}
  #splash .sp-fb{pointer-events:none;opacity:0;transform:translateY(3%);animation:spArt 1.6s .25s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes spArt{to{opacity:1;transform:none}}
  #splash .sp-center{position:absolute;left:50%;top:21%;transform:translateX(-50%);display:grid;justify-items:center;text-align:center;width:max-content}
  #splash .sp-mark{display:block;width:clamp(84px,8vw,140px);height:auto;overflow:visible}
  #splash .sp-mark path{transform-box:fill-box;opacity:0}
  #splash .sp-f{fill:#34d399;transform-origin:left center;animation:spF .8s .2s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-s{fill:#fff;transform-origin:center bottom;animation:spS .6s .6s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-r{fill:#fff;transform-origin:left bottom;animation:spR .8s .4s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-word{font:400 clamp(1.5rem,2.6vw,2.4rem)/1.1 var(--font-display,system-ui),system-ui,sans-serif;letter-spacing:-.03em;margin-top:clamp(12px,1.6vw,24px);white-space:nowrap}
  #splash .sp-word b{font-weight:800;display:inline-block;opacity:0;animation:spWord .9s .9s cubic-bezier(.2,.8,.2,1) forwards}
  #splash .sp-word span{display:inline-block;opacity:0;animation:spWord .9s 1.1s cubic-bezier(.2,.8,.2,1) forwards}
  #splash .sp-tag{margin:clamp(10px,1.4vw,22px) 0 0;font:400 clamp(.78rem,1vw,1.05rem)/1.4 var(--font-body,system-ui),system-ui,sans-serif;color:#a9d9c6;letter-spacing:.2em;opacity:0;animation:spTag 1.1s 1.4s ease-out forwards}
  #splash .sp-load{position:absolute;left:0;right:0;bottom:clamp(48px,10vh,110px);display:grid;justify-items:center;gap:14px;opacity:0;animation:spFin .5s .5s forwards}
  #splash .sp-bar{width:min(220px,56vw);height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
  #splash .sp-bar i{display:block;height:100%;border-radius:3px;background:#34d399;transform:scaleX(0);transform-origin:left;animation:spFill 2.2s .6s cubic-bezier(.45,.05,.25,1) forwards}
  #splash .sp-cap{position:relative;height:1.3em;width:14em;text-align:center;font:500 .8125rem/1.3 var(--font-body,system-ui),system-ui,sans-serif;letter-spacing:.06em;color:#a9d9c6}
  #splash .sp-cap span{position:absolute;inset:0;opacity:0}
  #splash .sp-cap span:nth-child(1){animation:spCap 1.4s .6s ease-in-out forwards}
  #splash .sp-cap span:nth-child(2){animation:spCapIn .6s 2s ease-out forwards}
  @keyframes spDraw{to{stroke-dashoffset:0}}
  @keyframes spFin{to{opacity:1}}
  @keyframes spF{from{opacity:0;transform:translateX(-45%) scaleX(.4)}to{opacity:1;transform:none}}
  @keyframes spS{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
  @keyframes spR{from{opacity:0;transform:translate(35%,25%) rotate(10deg)}to{opacity:1;transform:none}}
  @keyframes spWord{from{opacity:0;transform:translateY(18px);letter-spacing:.14em}to{opacity:1;transform:none;letter-spacing:-.01em}}
  @keyframes spTag{from{opacity:0;letter-spacing:.42em}to{opacity:1;letter-spacing:.2em}}
  @keyframes spCap{0%{opacity:0;transform:translateY(4px)}20%,75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-4px)}}
  @keyframes spCapIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes spFill{to{transform:scaleX(1)}}
  @media (max-aspect-ratio:1/1){
    #splash{background:radial-gradient(70% 26% at 50% 24%,#04704a 0%,#02452f 45%,#01100c 100%)}
    #splash .sp-art{inset:auto 0 0 0;height:calc(100vw * 941 / 1672);-webkit-mask-image:linear-gradient(180deg,transparent 42%,#000 50%);mask-image:linear-gradient(180deg,transparent 42%,#000 50%)}
    #splash .sp-center{top:22%}
  }
  @media (prefers-reduced-motion:reduce){#splash *,#splash{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.2s!important}#splash .sp-bar i{transform:scaleX(1)}#splash .sp-cap span:nth-child(1){display:none}#splash .sp-cap span:nth-child(2){opacity:1}}
</style>
