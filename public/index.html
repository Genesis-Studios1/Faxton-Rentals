<style>
  /* Splash screen: inline so it paints before anything else loads. Style follows the Faxton Homes splash. */
  #splash{position:fixed;inset:0;z-index:1000;overflow:hidden;color:#fff;font-family:Inter,system-ui,sans-serif;
    background:radial-gradient(36% 48% at 48% 23%,#046c47 0%,#02492f 36%,#012c20 62%,#011510 100%);
    clip-path:circle(150% at 50% 40%);transition:clip-path .95s cubic-bezier(.75,0,.2,1),opacity .95s ease-in}
  #splash.leave{clip-path:circle(0% at 50% 40%);opacity:0;pointer-events:none}
  #splash.leave .sp-center,#splash.leave .sp-load{transform:translateX(-50%) scale(.85);opacity:0;transition:transform .7s cubic-bezier(.6,0,.4,1),opacity .6s}
  #splash{--s:min(max(calc(100vw / 1672),calc(100vh / 941)),1.6px)}
  #splash .sp-art{position:absolute;bottom:0;fill:none;stroke:#4fe3ab;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;overflow:visible}
  #splash .sp-art.l{left:0;width:calc(700 * var(--s));height:calc(541 * var(--s))}
  #splash .sp-art.r{right:0;width:calc(692 * var(--s));height:calc(511 * var(--s))}
  #splash .sp-art .arch path{stroke-dasharray:1;stroke-dashoffset:1;opacity:.62;animation:spDraw var(--t,1.6s) var(--d,.3s) cubic-bezier(.4,.1,.2,1) forwards}
  #splash .sp-art .fol{opacity:0;animation:spFol 3s 3.2s ease-out forwards}#splash .sp-art .fol path{opacity:.5;stroke-width:1.1}
  #splash .sp-glow{position:absolute;left:50%;top:6%;width:70vmin;height:70vmin;margin-left:-35vmin;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.30),transparent 65%);opacity:0;animation:spGlow 2.6s .3s ease-out forwards}
  #splash .sp-center{position:absolute;left:50%;top:26%;transform:translateX(-50%);display:grid;justify-items:center;text-align:center;width:max-content}
  #splash .sp-markwrap{position:relative;width:clamp(96px,9.5vw,190px)}
  #splash .sp-mark{display:block;width:100%;height:auto;overflow:visible}
  #splash .sp-mark path{transform-box:fill-box;opacity:0}
  #splash .sp-f{fill:#34d399;transform-origin:left center;animation:spF .8s .2s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-s{fill:#d8fff0;transform-origin:center bottom;animation:spS .6s .6s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-r{fill:#d8fff0;transform-origin:left bottom;animation:spR .8s .4s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-markwrap{animation:spPulse 1.4s 1.2s ease-in-out 1}
  #splash .sp-shine{position:absolute;inset:0;z-index:2;pointer-events:none;-webkit-mask:url(assets/mark.svg) center/100% 100% no-repeat;mask:url(assets/mark.svg) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) no-repeat;background-size:260% 100%;background-position:160% 0;animation:spShine 1.1s 1.3s ease-in-out forwards}
  #splash .sp-word{margin-top:clamp(18px,3.2vw,60px);font:500 clamp(1.5rem,2.75vw,3.3rem)/1 'Inter Tight',Inter,system-ui,sans-serif;letter-spacing:.26em;margin-right:-.26em;white-space:nowrap;text-transform:uppercase}
  #splash .sp-word b,#splash .sp-word span{display:inline-block;opacity:0;animation:spWord .9s cubic-bezier(.2,.8,.2,1) forwards}
  #splash .sp-word b{font-weight:500;color:#fff;animation-delay:.95s}#splash .sp-word span{color:#34d399;animation-delay:1.15s}
  #splash .sp-tag{margin:clamp(10px,1.7vw,30px) 0 0;font:400 clamp(.85rem,1.3vw,1.6rem)/1.3 Inter,system-ui,sans-serif;color:#bfe9d9;letter-spacing:.09em;opacity:0;animation:spTag 1s 1.5s ease-out forwards}
  #splash .sp-load{position:absolute;left:50%;top:80%;transform:translateX(-50%);width:clamp(220px,20.5vw,420px);display:grid;justify-items:center;gap:clamp(14px,1.7vw,32px)}
  #splash .sp-bar{width:100%;height:4px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;opacity:0;animation:spFade .6s .6s forwards}
  #splash .sp-bar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#1fb985,#5eead4);transform:scaleX(0);transform-origin:left;animation:spBar 6.6s .6s cubic-bezier(.45,.1,.25,1) forwards}
  #splash .sp-label{font:400 clamp(.78rem,1.05vw,1.25rem)/1 Inter,system-ui,sans-serif;letter-spacing:.14em;color:#b5ddcd;opacity:0;animation:spFade .6s .8s forwards;transition:opacity .25s}
  @keyframes spDraw{to{stroke-dashoffset:0}}
  @keyframes spFol{to{opacity:1}}
  @keyframes spGlow{0%{opacity:0;transform:scale(.6)}60%{opacity:1}100%{opacity:.5;transform:scale(1)}}
  @keyframes spF{from{opacity:0;transform:translateX(-45%) scaleX(.4)}to{opacity:1;transform:none}}
  @keyframes spS{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
  @keyframes spR{from{opacity:0;transform:translate(35%,25%) rotate(10deg)}to{opacity:1;transform:none}}
  @keyframes spPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(52,211,153,0))}50%{filter:drop-shadow(0 0 26px rgba(52,211,153,.6))}}
  @keyframes spShine{from{background-position:160% 0}to{background-position:-60% 0}}
  @keyframes spWord{from{opacity:0;transform:translateY(16px);letter-spacing:.5em}to{opacity:1;transform:none;letter-spacing:.26em}}
  @keyframes spTag{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes spFade{to{opacity:1}}
  @keyframes spBar{to{transform:scaleX(1)}}
  @media (max-width:700px){#splash .sp-center{top:24%}#splash .sp-word{letter-spacing:.18em;font-size:1.5rem}#splash .sp-load{top:78%}}
  @media (prefers-reduced-motion:reduce){#splash *,#splash{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.2s!important}#splash .sp-bar i{transform:scaleX(1)}}
</style>
